<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="data:,">

</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">

      <span class="brand-name">Odyssey</span>
      <span class="brand-sub">Bedside Forecast</span>

    <nav class="topbar__nav" aria-label="Main">

    <span class="mode-badge" id="mode-badge" hidden></span>

    <span id="provenance">Loading the model…</span>
    <button type="button" class="linklike" id="theme-toggle">Dark mode</button>
  </footer>
