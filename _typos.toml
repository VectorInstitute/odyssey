[default.extend-words]
# ND = MIMIC-IV prescription route abbreviation (nasal, with NU/NS/NAS) in
# odyssey/data/concepts.py's ANTIBIOTIC_ROUTE_EXCLUDE, not a typo for "AND".
ND = "ND"
# INH (inhalation) and OINT (ointment) are pharmacy form abbreviations in
# odyssey/data/code_normalization.py, not typos.
INH = "INH"
OINT = "OINT"
# EHR = Electronic Health Records -- core domain vocabulary throughout this
# codebase (EHR-Mamba3, CachedEHREmbeddings, ...), not a typo for "HER".
EHR = "EHR"
ehr = "ehr"
# NAM = Neural Additive Model (Agarwal et al.), a model family in the README.
NAM = "NAM"
NAMs = "NAMs"
# GAM = Generalized Additive Model, paired with NAM as one of the project's
# comparator model families (NAM-GAM) -- not a typo for "GAME".
GAM = "GAM"
GAMs = "GAMs"
# MCH = Mean Corpuscular Hemoglobin, a standard CBC lab concept name in
# scripts/gemini/extract_dry.py's TOP_LAB_CONCEPTS, not a typo for "MUCH".
MCH = "MCH"

[default.extend-identifiers]
# get_rolling_window_indicies is MEDS-Tab's own real, upstream function name
# (genuinely misspelled there, not by us) -- referenced in prose in
# odyssey/inference/meds_tab_baseline.py and its test to explain a real
# workaround for its behavior. Scoped to the exact identifier rather than
# whitelisting the bare word "indicies" globally, so a real typo of that
# word elsewhere in the codebase still gets caught.
get_rolling_window_indicies = "get_rolling_window_indicies"

[files]
# scripts/gemini/out/ holds verbatim reports of GEMINI's own database
# catalog (schema/extract-dry reports) -- real external column/table names
# (e.g. StatCan census abbreviations like "c16_eth_oce", "usres") are not
# ours to rename and will keep showing up as new false positives every time
# a fresh report is committed, so the whole directory is excluded rather
# than growing an extend-words entry per column.
extend-exclude = ["scripts/gemini/out/"]
