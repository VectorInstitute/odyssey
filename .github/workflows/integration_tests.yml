name: integration tests
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - .github/workflows/unit_tests.yml
      - .github/workflows/integration_tests.yml
      - '**.py'
      - '**.sh'
      - '**.ipynb'
      - uv.lock
      - pyproject.toml
      - '**.rst'
      - '**.md'
  pull_request:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - .github/workflows/unit_tests.yml
      - .github/workflows/integration_tests.yml
      - '**.py'
      - '**.sh'
      - '**.ipynb'
      - uv.lock
      - pyproject.toml
      - '**.rst'
      - '**.md'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.9.11"
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --dev

      # test_real_meds_data_tokenizes_and_runs_through_the_model
      # (tests/odyssey/data/test_sequences.py) fetches the public MIMIC-IV
      # demo from PhysioNet -- an external network dependency this workflow
      # doesn't control. Cached across runs, keyed on uv.lock (changes
      # whenever the pinned meds-extract/MEDS_extract version, and thus the
      # extraction it produces, changes) so the download only ever happens
      # on a real cache miss. On a cache hit the test skips the fetch
      # entirely and reuses the prior extraction -- see that test's own
      # docstring; the extraction, tokenization, and model forward pass
      # steps are never skipped or softened, only the redundant re-download.
      - name: Cache MIMIC-IV demo extraction
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/meds_demo_cache
          key: mimic-iv-demo-${{ hashFiles('uv.lock') }}

      - name: Install dependencies and check code
        env:
          MEDS_DEMO_CACHE_DIR: ${{ runner.temp }}/meds_demo_cache
        run: |
          set -eo pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if uv run pytest -m "integration_test" --cov odyssey --cov-report=xml tests; then
              exit 0
            fi
            echo "pytest attempt $i/$attempts failed" >&2
            if [ "$i" -lt "$attempts" ]; then
              # Real incident this retries past: PhysioNet ConnectTimeout on
              # a demo-fetch cache miss, unrelated to the tests themselves.
              echo "retrying after a short delay..." >&2
              sleep 30
            fi
          done
          echo "pytest failed after $attempts attempts" >&2
          exit 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: VectorInstitute/odyssey
          fail_ci_if_error: false
          verbose: true
