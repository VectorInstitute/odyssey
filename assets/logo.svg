<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Odyssey — interpretable clinical foundation models">
  <!--
    Odyssey — a voyage navigated by named stars.

    A celestial navigation chart: the patient's timeline is a dotted
    voyage route crossing a star chart. The constellation's stars are
    named clinical concepts (SEPSIS, AKI, SIRS, ...) — you navigate by
    stars you can name, not by dead reckoning. One dashed violet star is
    the unknown concept. One constellation line hides a heartbeat.
    A ghost compass rose sits beneath it all.

    Palette: midnight navy · chart gold · signal cyan · violet · pulse rose
  -->
  <defs>
    <!-- Card background -->
    <linearGradient id="bgg" x1="0" y1="0" x2="800" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#070C1E"/>
      <stop offset="55%"  stop-color="#0A1130"/>
      <stop offset="100%" stop-color="#070E24"/>
    </linearGradient>

    <!-- Card border -->
    <linearGradient id="borderg" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8C27A"/>
      <stop offset="45%"  stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Wordmark: white → pale cyan → chart gold -->
    <linearGradient id="wm" x1="424" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#BCE8FF"/>
      <stop offset="100%" stop-color="#E8C27A"/>
    </linearGradient>

    <!-- Rule under the wordmark, fading out -->
    <linearGradient id="ruleg" x1="427" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8C27A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#E8C27A" stop-opacity="0"/>
    </linearGradient>

    <!-- Four-point star sparkle, centered on origin -->
    <path id="spark" d="M0,-6 C0.7,-1.8 1.8,-0.7 6,0 C1.8,0.7 0.7,1.8 0,6 C-0.7,1.8 -1.8,0.7 -6,0 C-1.8,-0.7 -0.7,-1.8 0,-6 Z"/>

    <!-- Voyage route: the patient timeline crossing the chart -->
    <path id="route" d="M36,196 C110,188 130,160 185,142 C240,124 260,96 330,84 C352,80 372,72 396,62"/>

    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- ── Night sky card ────────────────────────────────────────────── -->
  <rect width="800" height="230" rx="18" fill="url(#bgg)"/>

  <!-- Aurora blobs, drifting slowly -->
  <g opacity="0.75">
    <ellipse cx="640" cy="30" rx="230" ry="85" fill="#67E8F9" opacity="0.07" filter="url(#blob)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -40 12; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="130" cy="215" rx="210" ry="80" fill="#A78BFA" opacity="0.09" filter="url(#blob)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 36 -10; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Faint great-circle chart arcs -->
  <g stroke="#9FB4D8" fill="none" stroke-width="1" opacity="0.06">
    <path d="M0,64 Q400,112 800,52"/>
    <path d="M0,168 Q400,124 800,176"/>
  </g>

  <!-- ── Starfield ─────────────────────────────────────────────────── -->
  <g fill="#DCE8FF">
    <circle cx="62"  cy="34"  r="0.9" opacity="0.4"/>
    <circle cx="118" cy="86"  r="0.7" opacity="0.3"/>
    <circle cx="156" cy="24"  r="1.1" opacity="0.5"/>
    <circle cx="238" cy="36"  r="0.7" opacity="0.35"/>
    <circle cx="300" cy="58"  r="0.9" opacity="0.4"/>
    <circle cx="342" cy="30"  r="0.7" opacity="0.3"/>
    <circle cx="58"  cy="132" r="0.7" opacity="0.3"/>
    <circle cx="92"  cy="178" r="0.9" opacity="0.4"/>
    <circle cx="176" cy="196" r="0.7" opacity="0.3"/>
    <circle cx="262" cy="186" r="1.0" opacity="0.4"/>
    <circle cx="332" cy="160" r="0.7" opacity="0.35"/>
    <circle cx="368" cy="196" r="0.8" opacity="0.3"/>
    <circle cx="412" cy="42"  r="0.9" opacity="0.4"/>
    <circle cx="452" cy="188" r="0.8" opacity="0.35"/>
    <circle cx="498" cy="30"  r="0.7" opacity="0.3"/>
    <circle cx="540" cy="196" r="0.9" opacity="0.35"/>
    <circle cx="586" cy="52"  r="0.7" opacity="0.3"/>
    <circle cx="628" cy="182" r="0.8" opacity="0.3"/>
    <circle cx="668" cy="34"  r="1.0" opacity="0.4"/>
    <circle cx="706" cy="200" r="0.7" opacity="0.3"/>
    <circle cx="742" cy="60"  r="0.9" opacity="0.4"/>
    <circle cx="770" cy="150" r="0.7" opacity="0.3"/>
    <circle cx="722" cy="112" r="0.7" opacity="0.25"/>
    <circle cx="386" cy="120" r="0.7" opacity="0.25"/>
    <!-- twinklers -->
    <circle cx="206" cy="70"  r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86"  cy="98"  r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.1s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="296" cy="132" r="0.9" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.8s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="616" cy="86"  r="1.0" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="64"  r="0.8" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.6s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="756" cy="196" r="0.9" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Ghost compass rose ────────────────────────────────────────── -->
  <g stroke="#9FB4D8" fill="none">
    <circle cx="200" cy="115" r="80" stroke-width="1" stroke-dasharray="1 9.9" opacity="0.13"/>
    <circle cx="200" cy="115" r="62" stroke-width="0.7" opacity="0.08"/>
    <path d="M200,57 L205,115 L200,173 L195,115 Z M142,115 L200,110 L258,115 L200,120 Z"
          fill="#9FB4D8" stroke="none" opacity="0.07"/>
  </g>

  <!-- ── The voyage route ──────────────────────────────────────────── -->
  <use href="#route" stroke="#E8C27A" stroke-width="2.4" fill="none" opacity="0.08"/>
  <use href="#route" stroke="#E8C27A" stroke-width="2" fill="none"
       stroke-linecap="round" stroke-dasharray="0.1 7" opacity="0.55"/>

  <!-- The ship: a comet with a trailing wake -->
  <g fill="#FFF3D6">
    <circle r="2.4" opacity="0" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.7" opacity="0" fill="#E8C27A" filter="url(#softglow)">
      <animateMotion dur="7s" begin="0.14s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="0.14s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.1" opacity="0" fill="#E8C27A">
      <animateMotion dur="7s" begin="0.28s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
      <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.06;0.9;1" dur="7s" begin="0.28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── The concept constellation ─────────────────────────────────── -->

  <!-- Constellation lines -->
  <g stroke="#E8C27A" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.32">
    <path d="M100,65 L178,42"/>
    <path d="M178,42 L262,72"/>
    <path d="M100,65 L128,128"/>
    <path d="M216,150 L318,120"/>
    <path d="M262,72 L318,120"/>
    <animate attributeName="opacity" values="0.24;0.42;0.24" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- One constellation line hides a heartbeat -->
  <path d="M128,128 L156,134 L163,114 L171,158 L178,140 L216,150"
        stroke="#FB7185" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- Named concept stars -->
  <g fill="#E8C27A">
    <g transform="translate(100 65)">
      <use href="#spark" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(178 42) scale(0.8)">
      <use href="#spark" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(262 72) scale(1.1)">
      <use href="#spark" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(128 128) scale(0.9)">
      <use href="#spark" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(216 150) scale(0.75)">
      <use href="#spark" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- The unknown concept: a dashed, slowly turning star you can't name yet -->
  <g>
    <circle cx="318" cy="120" r="7.5" fill="none" stroke="#A78BFA" stroke-width="1.5"
            stroke-dasharray="3.6 3.3" filter="url(#softglow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 318 120" to="360 318 120" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="318" cy="120" r="2" fill="#A78BFA">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Star names: the interpretability -->
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
     font-size="9" letter-spacing="1.4" fill="#9FB4D8" opacity="0.78">
    <text x="86"  y="50">SEPSIS</text>
    <text x="190" y="36">AKI</text>
    <text x="275" y="62">SIRS</text>
    <text x="112" y="122" text-anchor="end">HYPOXIA</text>
    <text x="212" y="171">SHOCK</text>
    <text x="318" y="144" text-anchor="middle" fill="#A78BFA">UNKNOWN</text>
  </g>

  <!-- ── Shooting star over the wordmark ───────────────────────────── -->
  <g opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.05;1" calcMode="linear">
      <mpath href="#shootpath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.02;0.05;1" dur="9s" repeatCount="indefinite"/>
    <line x1="-26" y1="-5.4" x2="0" y2="0" stroke="#CFE9FF" stroke-width="1.3" stroke-linecap="round"/>
    <circle r="1.6" fill="#FFFFFF"/>
  </g>
  <path id="shootpath" d="M482,26 L706,72" fill="none"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────── -->
  <text x="424" y="122"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="56" font-weight="200" letter-spacing="10.5"
        fill="url(#wm)">ODYSSEY</text>

  <line x1="427" y1="139" x2="620" y2="139" stroke="url(#ruleg)" stroke-width="1"/>

  <text x="427" y="160"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="9" font-weight="500" letter-spacing="2.6"
        fill="#7C8FB8">INTERPRETABLE CLINICAL FOUNDATION MODELS</text>

  <!-- Card border -->
  <rect x="0.5" y="0.5" width="799" height="229" rx="17.5" fill="none"
        stroke="url(#borderg)" stroke-width="1" opacity="0.3"/>
</svg>
