<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Odyssey — interpretable clinical foundation models">
  <!--
    Odyssey logo — the architecture, drawn.

    Left icon reads left-to-right like the model itself:
      · five patient event streams (the middle one carries an ECG blip,
        an homage to the previous logo / EHR-Mamba lineage)
      · streams converge through a narrow waist — the concept bottleneck
      · they emerge as discrete concept nodes: three known (filled) and
        one unknown (dashed ring, orthogonality-penalized free capacity)
      · concepts fan into a single pulsing forecast

    Vector brand palette:
      magenta   #EB088A   cobalt    #313CFF
      violet    #8A25C9   turquoise #48C0D9
  -->
  <defs>

    <!-- ── Stream paths (also used as motion paths for pulses) ─────── -->
    <path id="s1" d="M24,44  L120,44  C158,44  172,96  196,100"/>
    <path id="s2" d="M24,72  L126,72  C160,72  174,98  196,100"/>
    <path id="s3" d="M24,100 L54,100 L61,106 L67,74 L73,111 L78,100 L196,100"/>
    <path id="s4" d="M24,128 L126,128 C160,128 174,102 196,100"/>
    <path id="s5" d="M24,156 L120,156 C158,156 172,104 196,100"/>

    <!-- ── Bottleneck → concept fan-out ────────────────────────────── -->
    <path id="f1" d="M196,100 C214,100 224,64  244,64"/>
    <path id="f2" d="M196,100 C216,100 226,88  244,88"/>
    <path id="f3" d="M196,100 C216,100 226,112 244,112"/>
    <path id="f4" d="M196,100 C214,100 224,136 244,136"/>

    <!-- ── Concepts → forecast ─────────────────────────────────────── -->
    <path id="p1" d="M250,64  C272,66  282,94  294,99"/>
    <path id="p2" d="M250,88  C270,90  282,97  294,100"/>
    <path id="p3" d="M250,112 C270,110 282,103 294,100"/>
    <path id="p4" d="M251,136 C272,134 282,106 294,101"/>

    <!-- Streams: magenta → violet → cobalt across the journey -->
    <linearGradient id="streamg" x1="24" y1="0" x2="196" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#EB088A"/>
      <stop offset="55%"  stop-color="#8A25C9"/>
      <stop offset="100%" stop-color="#313CFF"/>
    </linearGradient>

    <!-- Fan-out: cobalt → turquoise -->
    <linearGradient id="fang" x1="196" y1="0" x2="244" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#313CFF"/>
      <stop offset="100%" stop-color="#48C0D9"/>
    </linearGradient>

    <!-- Wordmark -->
    <linearGradient id="tg" x1="336" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#EB088A"/>
      <stop offset="55%"  stop-color="#8A25C9"/>
      <stop offset="100%" stop-color="#313CFF"/>
    </linearGradient>

    <!-- Moving sheen swept across the wordmark -->
    <linearGradient id="sheen" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="120 0; 760 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Ambient glow behind the icon -->
    <radialGradient id="glowbg" cx="170" cy="100" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8A25C9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8A25C9" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tracerglow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <rect width="800" height="200" fill="url(#glowbg)"/>

  <!-- ── Ghost layer (faint echo of the whole graph) ───────────────── -->
  <g stroke-width="1" fill="none" opacity="0.16" stroke-linecap="round" stroke-linejoin="round">
    <use href="#s1" stroke="url(#streamg)"/>
    <use href="#s2" stroke="url(#streamg)"/>
    <use href="#s3" stroke="url(#streamg)"/>
    <use href="#s4" stroke="url(#streamg)"/>
    <use href="#s5" stroke="url(#streamg)"/>
  </g>

  <!-- ── Event streams ─────────────────────────────────────────────── -->
  <g stroke="url(#streamg)" stroke-width="2.1" fill="none"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9">
    <use href="#s1"/>
    <use href="#s2"/>
    <use href="#s3"/>
    <use href="#s4"/>
    <use href="#s5"/>
  </g>

  <!-- Event tokens scattered along the streams -->
  <g filter="url(#softglow)">
    <circle cx="46"  cy="44"  r="2.4" fill="#EB088A"/>
    <circle cx="80"  cy="44"  r="2.0" fill="#8A25C9" opacity="0.85"/>
    <circle cx="106" cy="44"  r="2.4" fill="#313CFF" opacity="0.9"/>
    <circle cx="38"  cy="72"  r="2.0" fill="#8A25C9" opacity="0.85"/>
    <circle cx="94"  cy="72"  r="2.4" fill="#EB088A"/>
    <circle cx="118" cy="72"  r="2.0" fill="#313CFF" opacity="0.9"/>
    <circle cx="112" cy="100" r="2.2" fill="#8A25C9" opacity="0.85"/>
    <circle cx="150" cy="100" r="2.0" fill="#313CFF" opacity="0.9"/>
    <circle cx="52"  cy="128" r="2.4" fill="#313CFF" opacity="0.9"/>
    <circle cx="88"  cy="128" r="2.0" fill="#EB088A" opacity="0.9"/>
    <circle cx="114" cy="128" r="2.4" fill="#8A25C9" opacity="0.85"/>
    <circle cx="42"  cy="156" r="2.0" fill="#EB088A" opacity="0.9"/>
    <circle cx="72"  cy="156" r="2.4" fill="#8A25C9" opacity="0.85"/>
    <circle cx="104" cy="156" r="2.0" fill="#313CFF" opacity="0.9"/>
  </g>

  <!-- ECG R-peak node on the middle stream -->
  <circle cx="67" cy="74" r="3.6" fill="#EB088A" filter="url(#glow)">
    <animate attributeName="r"       values="3.2;4.6;3.2" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1"     dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ── The bottleneck ────────────────────────────────────────────── -->
  <circle cx="196" cy="100" r="5" fill="#313CFF" filter="url(#glow)">
    <animate attributeName="r"       values="4.4;6;4.4" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Fan-out to concepts ───────────────────────────────────────── -->
  <g stroke="url(#fang)" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.85">
    <use href="#f1"/>
    <use href="#f2"/>
    <use href="#f3"/>
    <use href="#f4"/>
  </g>

  <!-- Known concepts: three filled nodes -->
  <circle cx="244" cy="64" r="4.6" fill="#48C0D9" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="244" cy="88" r="4.6" fill="#313CFF" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="244" cy="112" r="4.6" fill="#48C0D9" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Unknown concept: slowly rotating dashed ring -->
  <g filter="url(#softglow)">
    <circle cx="244" cy="136" r="5.6" fill="none" stroke="#8A25C9" stroke-width="1.7"
            stroke-dasharray="3.4 3.1">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 244 136" to="360 244 136" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="244" cy="136" r="2" fill="#8A25C9" opacity="0.75">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Concepts → forecast ───────────────────────────────────────── -->
  <g stroke="#48C0D9" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.55">
    <use href="#p1"/>
    <use href="#p2"/>
    <use href="#p3"/>
    <use href="#p4"/>
  </g>

  <!-- Forecast: pulsing ring -->
  <circle cx="296" cy="100" r="8" fill="none" stroke="#48C0D9" stroke-width="1.5">
    <animate attributeName="r"       values="8;18;8"      dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7"   dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="296" cy="100" r="4.2" fill="#48C0D9" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Pulses riding the streams into the bottleneck ─────────────── -->
  <g fill="#48C0D9" filter="url(#tracerglow)">
    <circle r="3" opacity="0">
      <animateMotion dur="2.75s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="2.75s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity="0">
      <animateMotion dur="2.75s" begin="0.55s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="2.75s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity="0">
      <animateMotion dur="2.75s" begin="1.1s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="2.75s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity="0">
      <animateMotion dur="2.75s" begin="1.65s" repeatCount="indefinite"><mpath href="#s4"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="2.75s" begin="1.65s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" opacity="0">
      <animateMotion dur="2.75s" begin="2.2s" repeatCount="indefinite"><mpath href="#s5"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="2.75s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Wordmark ──────────────────────────────────────────────────── -->
  <text x="336" y="124"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3"
        fill="url(#tg)">odyssey</text>
  <text x="336" y="124"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3"
        fill="url(#sheen)">odyssey</text>

  <!-- Tagline -->
  <text x="339" y="154"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="2.6"
        fill="#8b8ba3">interpretable clinical foundation models</text>
</svg>
