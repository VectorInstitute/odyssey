<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Odyssey — interpretable clinical foundation models">
  <!--
    Odyssey logo — an ECG strip that reads like the model.

      solid trace        →  three beads          →  dotted trace
      observed history      the concept bottleneck   the forecasted next beat

    Palette: clinical teal #14B8A6 · amber #F59E0B · violet #8B5CF6 · indigo #6366F1
    Mid-tone colors so it reads on both light and dark GitHub themes.
  -->
  <defs>
    <!-- Hidden continuous path for the tracer dot: history → beads → forecast -->
    <path id="sweep" d="M30,90 L64,90
             C66,90 69,76 75,76 C81,76 83,90 86,90
             L96,90 L100,97 L107,35 L114,103 L119,90
             L130,90
             C133,90 137,68 145,68 C153,68 156,90 160,90
             L222,90
             L236,90 L240,97 L247,38 L254,102 L259,90
             L270,90
             C273,90 277,72 284,72 C291,72 294,90 298,90"/>

    <!-- Forecast trace fades out to the right -->
    <linearGradient id="fadeg" x1="222" y1="0" x2="298" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Wordmark: teal → indigo -->
    <linearGradient id="tg" x1="340" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tracerglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Observed history: solid ECG trace -->
  <path d="M30,90 L64,90
           C66,90 69,76 75,76 C81,76 83,90 86,90
           L96,90 L100,97 L107,35 L114,103 L119,90
           L130,90
           C133,90 137,68 145,68 C153,68 156,90 160,90
           L166,90"
        stroke="#14B8A6" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)"/>

  <!-- The concept bottleneck: three beads the signal must pass through -->
  <circle cx="180" cy="90" r="4.5" fill="#14B8A6" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="194" cy="90" r="4.5" fill="#F59E0B" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="208" cy="90" r="4.5" fill="#8B5CF6" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Forecast: the next beat, dotted and fading -->
  <path d="M222,90 L236,90 L240,97 L247,38 L254,102 L259,90
           L270,90
           C273,90 277,72 284,72 C291,72 294,90 298,90"
        stroke="url(#fadeg)" stroke-width="2.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 6.5"/>

  <!-- Tracer sweeping the strip, like a live monitor -->
  <circle r="3.6" fill="#5EEAD4" filter="url(#tracerglow)">
    <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#sweep"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.9;1"
             dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Wordmark -->
  <text x="340" y="112"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
        font-size="80" font-weight="800" letter-spacing="-3"
        fill="url(#tg)">odyssey</text>

  <!-- Tagline -->
  <text x="343" y="142"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="2.6"
        fill="#8b8ba3">interpretable clinical foundation models</text>
</svg>
