      eventtime: ($unitadmittimestamp + $observationoffset::minutes) if not ($observationoffset >= 525600 or $observationoffset <= -525600)
  non_invasive_systolic:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_SYSTOLIC" if $noninvasivesystolic == $noninvasivesystolic'
