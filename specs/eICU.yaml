# The complete eICU-CRD 2.0 MEDS ETL, as a MESSY (MEDS-Extract Specification Syntax
# YAML) spec for MEDS-Extract >= 0.7 -- the same tooling the MIMIC-IV extraction uses
# (see README "Data pipeline"). Run it by filesystem path (it is not registered as an
# entry point, deliberately -- it lives with the project that owns it):
#
#     # Validate against the public eICU demo (no credentials needed):
#     uv run meds-extract-run spec=./specs/eICU.yaml output_dir=<out> dataset_key=demo
#
#     # Full eICU-CRD 2.0, already downloaded locally:
#     uv run meds-extract-run spec=./specs/eICU.yaml output_dir=<out> \
#         do_download=false input_dir=<path_to_eicu_2.0>
#
# Ported from the reference `eICU_MEDS` package (PyPI `eicu-meds` 0.0.2,
# https://github.com/Medical-Event-Data-Standard) -- its `pre_MEDS.py` +
# `table_preprocessors.yaml` + `event_configs.yaml` pipeline predates MESSY and pins
# meds-transforms~=0.2.4/polars<1.27, both incompatible with this project's stack, so
# the same extraction is expressed here declaratively instead. Event code shapes match
# that reference ETL (VITALS//PERIODIC//..., LAB//{labname}//..., MEDICATION//...), so
# downstream mappings stay compatible with the community convention; see
# odyssey/data/code_mapping.py's eICU table for the LOINC translations.
#
# Two eICU-specific realities this spec encodes, both taken from the reference ETL:
#
# 1. **Subjects are health-system stays.** eICU has no cross-stay patient identity
#    reliable enough to link on (`uniquepid` is documented as unreliable across
#    hospitals), so `patienthealthsystemstayid` is the subject id -- one subject per
#    contiguous hospital stay. Every non-patient table only carries
#    `patientunitstayid`, so each joins `patient` to reach the subject id.
#
# 2. **All times are pseudotimes reconstructed from offsets.** eICU stores only
#    minute offsets relative to ICU unit admission, plus the hospital-discharge year
#    and 24h clock times. Following the reference ETL: anchor each stay's hospital
#    discharge at Dec 31 of `hospitaldischargeyear` at `hospitaldischargetime24`,
#    derive unit admission by subtracting `hospitaldischargeoffset`, and every event
#    time as unit admission plus that event's own offset. Absolute dates are therefore
#    FICTIONAL; only intra-subject relative times are meaningful -- which is exactly
#    what odyssey's tokenization consumes (time since first event / deltas).
#
# Other conventions, matching the MIMIC-IV spec where applicable:
# - Null components of composite codes are coalesced to 'UNK' (`?? 'UNK'`) so a
#   missing categorical does not silently drop the event row.
# - Wide vitals tables (one column per signal, most cells null) guard each signal's
#   code with `if $x == $x`: a null measurement makes the comparison null, the code
#   null, and the row dropped -- without the guard every 5-minute vitalPeriodic row
#   would emit all 16 signal events regardless of which were actually measured.
# - `hadm_id: $patientunitstayid` on unit-scoped events: odyssey's visit derivation
#   (odyssey/data/sequences.py) groups events sharing an `hadm_id` into one visit,
#   and the ICU unit stay is the natural visit unit here.
# - Every offset-derived time is guarded to a +/- 1 year (525,600 minute) window:
#   raw eICU contains a small number of garbage offsets (0.0008% of events, led by
#   `drugstopoffset` and `labresultoffset`) that otherwise place single events
#   centuries away from their stay and blow up per-subject time spans. An
#   out-of-window offset nulls the computed time, and the extraction's null-time
#   filter drops the row. Quantified on the full extraction; see research journal
#   entry 06.

etl:
  dataset_name: eICU
  # No raw_dataset_version fallback here: `sources.dataset_version` below is the
  # single source of truth (the runner rejects a mismatched duplicate).
  n_subjects_per_shard: 1000

# Every table's subject id is the health-system stay id -- a raw column on
# `patient`, a joined-in column everywhere else.
_defaults:
  subject_id: $patienthealthsystemstayid

patient:
  _table:
    join:
      hospital:
        key: hospitalid
        cols: [numbedscategory, teachingstatus, region]
    cols:
      # See the header: Dec 31 of the discharge year + the charted 24h clock time
      # anchors the stay; everything else chains off it via minute offsets.
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      unitdischargetimestamp: ($unitadmittimestamp + $unitdischargeoffset::minutes) if not ($unitdischargeoffset >= 525600 or $unitdischargeoffset <= -525600)
      # `hospitaladmitoffset` is negative (admission precedes unit admission), so
      # addition is correct here too.
      hospitaladmittimestamp: ($unitadmittimestamp + $hospitaladmitoffset::minutes) if not ($hospitaladmitoffset >= 525600 or $hospitaladmitoffset <= -525600)
      # `age` is a string with the >89 HIPAA mask; the reference ETL maps it to 90.
      ageyears: 90 if $age == "> 89" else $age::?int
      # Born at the year's midpoint, per the reference ETL (age is in whole years).
      dateofbirth: $unitadmittimestamp - ($ageyears * 365.25 - 182.625)::days
      timeofdeath: $hospitaldischargetimestamp if $hospitaldischargestatus == "Expired"
  dob:
    code: MEDS_BIRTH
    time: $dateofbirth
  gender:
    code: f"GENDER//{$gender ?? 'UNK'}"
    time: null
  ethnicity:
    code: f"RACE//{$ethnicity ?? 'UNK'}"
    time: null
  hosp_admission:
    code: >-
      f"HOSPITAL_ADMISSION//{$hospitaladmitsource ?? 'UNK'}//{$region ?? 'UNK'}//{$teachingstatus ?? 'UNK'}//{$numbedscategory ?? 'UNK'}"
    time: $hospitaladmittimestamp
    hadm_id: $patientunitstayid
  hosp_discharge:
    code: >-
      f"HOSPITAL_DISCHARGE//{$hospitaldischargestatus ?? 'UNK'}//{$hospitaldischargelocation ?? 'UNK'}"
    time: $hospitaldischargetimestamp
    hadm_id: $patientunitstayid
  unit_admission:
    code: f"ICU_ADMISSION//{$unitadmitsource ?? 'UNK'}//{$unitstaytype ?? 'UNK'}"
    time: $unitadmittimestamp
    hadm_id: $patientunitstayid
  unit_admission_weight:
    code: '"ICU_ADMISSION_WEIGHT" if $admissionweight == $admissionweight'
    time: $unitadmittimestamp
    hadm_id: $patientunitstayid
    numeric_value: $admissionweight::?float
  unit_admission_height:
    code: '"ICU_ADMISSION_HEIGHT" if $admissionheight == $admissionheight'
    time: $unitadmittimestamp
    hadm_id: $patientunitstayid
    numeric_value: $admissionheight::?float
  unit_discharge:
    code: >-
      f"ICU_DISCHARGE//{$unitdischargestatus ?? 'UNK'}//{$unitdischargelocation ?? 'UNK'}"
    time: $unitdischargetimestamp
    hadm_id: $patientunitstayid
  unit_discharge_weight:
    code: '"ICU_DISCHARGE_WEIGHT" if $dischargeweight == $dischargeweight'
    time: $unitdischargetimestamp
    hadm_id: $patientunitstayid
    numeric_value: $dischargeweight::?float
  death:
    code: MEDS_DEATH
    # Null (non-expired) times drop the row -- the extraction's computed-time filter.
    time: $timeofdeath

# Shared shape for every offset-timed table below: join `patient` on
# `patientunitstayid` for the subject id + the three anchor columns, rebuild the
# anchor chain locally (joins deliver raw right-table columns only), then each
# event's time is `unitadmittimestamp + <that table's offset column>`.

admissionDx:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $admitdxenteredoffset::minutes) if not ($admitdxenteredoffset >= 525600 or $admitdxenteredoffset <= -525600)
  admission_diagnosis:
    code: f"ADMISSION_DIAGNOSIS//{$admitdxname ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid

allergy:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $allergyenteredoffset::minutes) if not ($allergyenteredoffset >= 525600 or $allergyenteredoffset <= -525600)
  allergy:
    code: f"ALLERGY//{$allergytype ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid
    text_value: $allergyname

carePlanGeneral:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $cplitemoffset::minutes) if not ($cplitemoffset >= 525600 or $cplitemoffset <= -525600)
  cpl_item:
    code: f"CAREPLAN_GENERAL//{$cplgroup ?? 'UNK'}//{$cplitemvalue ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid

carePlanEOL:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $cpleoldiscussionoffset::minutes) if not ($cpleoldiscussionoffset >= 525600 or $cpleoldiscussionoffset <= -525600)
  cpl_eol_discussion:
    code: CAREPLAN_EOL
    time: $eventtime
    hadm_id: $patientunitstayid

carePlanGoal:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $cplgoaloffset::minutes) if not ($cplgoaloffset >= 525600 or $cplgoaloffset <= -525600)
  cpl_goal:
    code: >-
      f"CAREPLAN_GOAL//{$cplgoalcategory ?? 'UNK'}//{$cplgoalvalue ?? 'UNK'}//{$cplgoalstatus ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid

carePlanInfectiousDisease:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $cplinfectdiseaseoffset::minutes) if not ($cplinfectdiseaseoffset >= 525600 or $cplinfectdiseaseoffset <= -525600)
  cpl_infect_disease:
    code: >-
      f"CAREPLAN_INFECTIOUS_DISEASE//{$infectdiseasesite ?? 'UNK'}//{$infectdiseaseassessment ?? 'UNK'}//{$treatment ?? 'UNK'}//{$responsetotherapy ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid

diagnosis:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $diagnosisoffset::minutes) if not ($diagnosisoffset >= 525600 or $diagnosisoffset <= -525600)
  diagnosis:
    # eICU's `icd9code` is frequently blank; 'UNK' keeps those rows (the
    # `diagnosisstring` text still identifies the diagnosis), matching the
    # reference ETL's null-as-UNK rendering.
    code: f"DIAGNOSIS//ICD//9//{$icd9code ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid
    text_value: $diagnosisstring
    diagnosis_priority: $diagnosispriority

infusionDrug:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $infusionoffset::minutes) if not ($infusionoffset >= 525600 or $infusionoffset <= -525600)
  infusion:
    code: INFUSION_DRUG
    time: $eventtime
    hadm_id: $patientunitstayid
    text_value: $drugname
    # Free-text rate strings ("OFF", "30 ml/hr") null out under the lenient cast.
    numeric_value: $infusionrate::?float
  patient_weight:
    code: '"SUBJECT_WEIGHT_AT_INFUSION" if $patientweight == $patientweight'
    time: $eventtime
    hadm_id: $patientunitstayid
    numeric_value: $patientweight::?float

lab:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $labresultoffset::minutes) if not ($labresultoffset >= 525600 or $labresultoffset <= -525600)
  lab:
    code: f"LAB//{$labname ?? 'UNK'}//{$labmeasurenamesystem ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid
    numeric_value: $labresult::?float
    text_value: $labresulttext

medication:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      drugstarttimestamp: ($unitadmittimestamp + $drugstartoffset::minutes) if not ($drugstartoffset >= 525600 or $drugstartoffset <= -525600)
      drugstoptimestamp: ($unitadmittimestamp + $drugstopoffset::minutes) if not ($drugstopoffset >= 525600 or $drugstopoffset <= -525600)
  drug_started:
    code: f"MEDICATION//STARTED//{$drugname ?? 'UNK'}"
    time: $drugstarttimestamp
    hadm_id: $patientunitstayid
    # Dosages are free text ("5 mg"); the lenient cast keeps pure numbers only.
    numeric_value: $dosage::?float
  drug_stopped:
    code: f"MEDICATION//STOPPED//{$drugname ?? 'UNK'}"
    time: $drugstoptimestamp
    hadm_id: $patientunitstayid

treatment:
  _table:
    join:
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
