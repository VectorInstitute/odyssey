      unitadmittimestamp: ($hospitaldischargetimestamp - $hospitaldischargeoffset::minutes) if not ($hospitaldischargeoffset >= 525600 or $hospitaldischargeoffset <= -525600)
      eventtime: ($unitadmittimestamp + $treatmentoffset::minutes) if not ($treatmentoffset >= 525600 or $treatmentoffset <= -525600)
  treatment:
    code: f"TREATMENT//ENTERED//{$treatmentstring ?? 'UNK'}"
    time: $eventtime
    hadm_id: $patientunitstayid

vitalAperiodic:
